name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DealFinder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DealFinder-apk
          path: DealFinder.apk

      # A stable download link to open on the phone:
      # https://github.com/<you>/<repo>/releases/latest/download/DealFinder.apk
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Deal Finder 0.1.${{ github.run_number }}
          make_latest: true
          files: DealFinder.apk
